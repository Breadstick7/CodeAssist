name: Build APK and Send Email

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Expo CLI
        run: npm install -g expo-cli eas-cli

      - name: Install Dependencies
        run: npm install

      - name: Build APK
        run: |
          eas build --platform android --profile preview --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: ./build/*.apk

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.your-email-provider.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Your Server Rack APK is Ready!"
          body: "Your APK has been built successfully! Download it here: <Download Link>"
          to: "your-email@example.com"
          from: "GitHub Actions <your-email@example.com>"

      - name: Notify on Success
        if: success()
        run: echo "✅ Build successful! Email sent."

